name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Validate shared tokens
        run: npm run tokens:check

      - name: Build production application
        run: npm run build

      - name: Run existing security unit tests
        run: npm run test:security --if-present

  security-audit:
    name: Security Scan & Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in source code
        run: |
          echo "Scanning src/ for leaked production secret keys..."
          if grep -rnE "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|APP_USR-[0-9a-zA-Z-]+" src/ 2>/dev/null; then
            echo "::error::Hardcoded production secret token detected in src/!"
            exit 1
          fi
          echo "No secrets detected in source code."

      - name: Run npm audit
        run: npm audit --audit-level=high
